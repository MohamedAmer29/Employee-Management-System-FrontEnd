<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>EMS — Employee Management System</title>
    <meta name="description" content="A modern Employee Management System for managing employees, attendance, leaves, payroll, performance reviews, and team tasks." />
    <meta name="keywords" content="employee management, HR, attendance, payroll, leave management, performance review, EMS" />
    <meta name="author" content="EMS" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#3f72af" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EMS — Employee Management System" />
    <meta property="og:description" content="Manage employees, attendance, leaves, payroll, performance, and tasks from one dashboard." />
    <meta property="og:site_name" content="EMS" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="EMS — Employee Management System" />
    <meta name="twitter:description" content="Manage employees, attendance, leaves, payroll, performance, and tasks from one dashboard." />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="http://localhost:5000" crossorigin />

    <!-- Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "EMS — Employee Management System",
        "url": "/",
        "description": "A modern Employee Management System for managing employees, attendance, leaves, payroll, performance reviews, and team tasks.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var isDark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (isDark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
